<!DOCTYPE html>
<html>

<head>
    <title>Login - QR Reward</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Welcome Back 👋</h1>

        <p>Login to your QR Reward account.</p>

        <form>

            <label>Email</label>
            <input 
                type="email" 
                placeholder="Enter your email"
            >

            <label>Password</label>
            <input 
                type="password" 
                placeholder="Enter your password"
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p>
            Don't have an account?
            <a href="register.html">Create Account</a>
        </p>

        <p>
            <a href="index.html">← Back to Home</a>
        </p>

    </div>

</body>

</html>
